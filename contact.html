<div class="container mt-5 d-flex justify-content-center">
    <div class="form-wrapper w-100">
  <h2 class="text-center mb-4">Contact Form</h2>
      <form class="row g-3 form-box" action="https://api.web3forms.com/submit" method="POST">
        
        <!-- Web3Forms Access Key -->
        <input type="hidden" name="access_key" value="a0a679f8-e4a1-4069-9c7c-93d1df16512f">
        
        <!-- Redirect to success page -->
        <input type="hidden" name="redirect" value="https://sacmusicals.com/success.html">

        <!-- START OF FORM -->
        <div class="col-md-6">
          <label for="firstName" class="form-label">First Name <span style="color: red;">&ast;</span></label>
          <input type="text" class="form-control" placeholder="First Name" name="First Name" id="firstName" required>
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last Name <span style="color: red;">&ast;</span></label>
          <input type="text" class="form-control" placeholder="Last Name" name="Last Name" id="lastName" required>
        </div>
        <div class="col-md-8">
          <label for="emailInfo" class="form-label">Email <span style="color: red;">&ast;</span></label>
          <input type="email" class="form-control" placeholder="example@email.com" name="email" id="emailInfo" required minlength="6" maxlength="254">
        </div>
        <div class="col-md-4">
          <label for="phoneNumber" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" placeholder="+1 (XXX) XXX-XXXX" name="Phone Number" id="phoneNumber">
        </div>
        <div class="col-md-12">
          <label for="comments" class="form-label">Message <span style="color: red;">&ast;</span></label>
          <textarea class="form-control" placeholder="Type your message here..." name="message" id="comments" rows="3" required></textarea>
        </div>
        <div class="col-md-12">
          <button type="submit" class="btn btn-primary">Submit</button>          
        </div>
  </form>
</div>
